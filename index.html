<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ByteMachi Games Hub | Brian Lara 2007</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0d0e12; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Top Header Bar */
    .header { background: #121318; border-bottom: 1px solid #282a36; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
    .brand { color: #22c55e; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .insta-link { color: #9ea3b0; font-size: 12px; text-decoration: none; font-weight: 600; background: #1a1d26; padding: 6px 12px; border-radius: 8px; border: 1px solid #282a36; }

    /* Loading Screen Container */
    #loader-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .sub { color: #9ea3b0; font-size: 13px; margin-bottom: 20px; }
    .progress-box { width: 100%; max-width: 320px; background: #1a1d26; height: 6px; border-radius: 10px; overflow: hidden; margin-bottom: 20px; border: 1px solid #282a36; }
    .progress-bar { width: 20%; height: 100%; background: #22c55e; border-radius: 10px; animation: load 2s ease-in-out forwards; }
    @keyframes load { 0% { width: 10%; } 100% { width: 100%; } }
    .play-btn { background: #22c55e; color: #000; font-weight: 800; border: none; padding: 12px 24px; border-radius: 12px; font-size: 14px; cursor: pointer; display: none; box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4); }

    /* Game Frame Container */
    #game-container { flex: 1; width: 100%; display: none; background: #000; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="header">
    <div class="brand">⚡ BYTEAMACHI GAMES</div>
    <a href="https://instagram.com/bytemachi" target="_blank" class="insta-link">📸 @bytemachi</a>
  </div>

  <!-- Loading Screen -->
  <div id="loader-container">
    <h1>BRIAN LARA 2007 🏏</h1>
    <p class="sub" id="status">Preparing ByteMachi game engine...</p>

    <div class="progress-box">
      <div class="progress-bar"></div>
    </div>

    <button class="play-btn" id="playBtn" onclick="startGame()">▶ LAUNCH GAME</button>
  </div>

  <!-- Embedded Game Area -->
  <div id="game-container">
    <iframe id="gameFrame" src=""></iframe>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('status').innerText = "Engine Ready by ByteMachi!";
      document.getElementById('playBtn').style.display = "inline-block";
    }, 2000);

    function startGame() {
      document.getElementById('loader-container').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      // Loads the game cleanly inside your site frame
      document.getElementById('gameFrame').src = "https://games.mickykharbanda.com/brian-lara/play/";
    }
  </script>

</body>
</html>
